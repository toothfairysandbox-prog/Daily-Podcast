  /* Decrypt the rundown as soon as the plan opens, not when play is tapped.
     iOS only lets audio start inside the tap itself; a download and a
     decryption between the tap and play() would be refused as autoplay. With
     the audio already sitting in memory, the tap can start it at once. */
  function prepareDayAudio(){
    var idx = dayState.index;
    if (!idx || !idx.audio || dayState.audioUrl) return;
    fetch(idx.audio + '?t=' + Date.now())
      .then(function(r){ if (!r.ok) throw new Error('missing'); return r.arrayBuffer(); })
      .then(function(buf){ return openSealed(dayState.key, buf, idx.date, 'audio'); })
      .then(function(plain){
        dayState.audioUrl = URL.createObjectURL(new Blob([plain], {type:'audio/mpeg'}));
        dayAudio.src = dayState.audioUrl;
        if (dayState.audioWanted) { dayState.audioWanted = false; dayAudio.play().catch(function(){}); }
      })
      .catch(function(){
        var sub = document.getElementById('rundownSub');
        if (sub) sub.textContent = 'Audio unavailable today';
        var rd = document.getElementById('rundown');
        if (rd) rd.disabled = true;
      });
  }
  function toggleDayAudio(){
    if (!dayState.audioUrl) { dayState.audioWanted = true; return; }
    dayAudio.paused ? dayAudio.play().catch(function(){}) : dayAudio.pause();
  }
  function syncDayAudio(){
    var ico = document.getElementById('rundownIco');
    if (ico) ico.innerHTML = dayAudio.paused ? I_PLAY : I_PAUSE;
  }
  dayAudio.addEventListener('play', function(){ audio.pause(); syncDayAudio(); });
  dayAudio.addEventListener('pause', syncDayAudio);
  dayAudio.addEventListener('ended', function(){
    syncDayAudio();
    var bar = document.getElementById('rundownBar'); if (bar) bar.style.width = '0%';
  });
  dayAudio.addEventListener('timeupdate', function(){
    var total = (dayState.doc && dayState.doc.audio_seconds) || dayAudio.duration || 0;
    var bar = document.getElementById('rundownBar'), sub = document.getElementById('rundownSub');
    if (bar && total) bar.style.width = Math.min(100, dayAudio.currentTime / total * 100) + '%';
    if (sub && total) sub.textContent = fmt(dayAudio.currentTime) + ' / ' + fmt(total);
  });

  // ---------- boot ----------
  var savedSpeed = Number(store.get('speed') || 1);
  if (SPEEDS.indexOf(savedSpeed) !== -1) speed = savedSpeed;

  fetch('push.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(p){ if (p && p.vapidPublicKey) vapidKey = p.vapidPublicKey; })
    .catch(function(){});

  fetch('episodes.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      data = d;
      if (!data.episodes || !data.episodes.length) throw new Error('empty');

      // An old home-screen app may still be running a cached shell against a
      // newer index, or the reverse. Say so instead of rendering nothing.
      if (!data.menu || !data.episodes[0].segments) {
        app.innerHTML = '<div class="state">This app needs a refresh.<br>' +
          'Close it fully and reopen, or remove and re-add it to your home screen.</div>';
        return;
      }

      if (data.lengths) LENGTHS = data.lengths;
      var name = data.show || "What's Up?";
      document.getElementById('showTitle').textContent = name;
      document.title = name;
      document.getElementById('stamp').textContent =
        'Updated ' + new Date(data.updated).toLocaleString(undefined,
          {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});

      var params = new URLSearchParams(location.search);
      if (params.get('tab') === 'day' && !params.get('episode')) setTab('day');

      // ?episode=YYYY-MM-DD lets a notification open straight to its day
      var want = params.get('episode');
      var at = want ? data.episodes.findIndex(function(e){ return e.date === want; }) : -1;
      dayIdx = at >= 0 ? at : 0;

      loadPrefs();
      var known = menu().map(function(m){ return m.slug; });
      prefs.topics = prefs.topics.filter(function(t){ return known.indexOf(t) !== -1; });
      prefs.length = Math.min(LENGTHS.max, Math.max(LENGTHS.min, prefs.length || LENGTHS['default']));

      // ?topics=a,b shares a mix for this visit without overwriting saved choices
      var fromUrl = (params.get('topics')||'').split(',')
        .filter(function(t){ return known.indexOf(t) !== -1; });
      if (fromUrl.length) { prefs.topics = fromUrl; prefs.done = true; }

      // A position from earlier this morning is good enough to plan with, and
      // using it now avoids the brief redrawing a moment after it appears.
      try {
        var was = JSON.parse(store.get('here') || 'null');
        if (was && Date.now() - was.at < 3*3600*1000) here = was;
      } catch(e){}

      bellState();

      if (!prefs.done || !prefs.topics.length) { openSetup(); return; }
      buildQueue();
      if (!queue.length) { openSetup(); return; }
      loadSegment(0, false);
      var resume = Number(store.get('pos:'+key()) || 0);
      if (resume > 5 && resume < totalDuration() - 10) seekGlobal(resume);
      renderPlayer();
      loadExtras();
    })
    .catch(function(){
      app.innerHTML = '<div class="state">No episodes yet.<br>The first one lands after the workflow runs.</div>';
    });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
